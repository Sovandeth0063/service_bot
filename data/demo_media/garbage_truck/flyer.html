<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<title>Garbage truck flyer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=block">
<style>
  :root { --green: #1f7a4d; --green-dark: #155c39; --cream: #fbf7ef; --ink: #1d2a24; --amber: #f2b632; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1080px; background: var(--cream); font-family: "Kantumruy Pro", sans-serif; color: var(--ink); }
  .top { background: var(--green); color: #fff; padding: 44px 64px 36px; display: flex; justify-content: space-between; align-items: center; }
  .top .who { font-size: 40px; font-weight: 600; }
  .top .tag { background: var(--amber); color: var(--ink); font-size: 30px; font-weight: 700; padding: 8px 26px; border-radius: 40px; }
  .hero { text-align: center; padding: 34px 40px 10px; }
  .truck { font-size: 230px; line-height: 1.1; }
  h1 { font-size: 92px; font-weight: 700; color: var(--green-dark); line-height: 1.35; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 26px; padding: 34px 56px 0; }
  .fact { background: #fff; border: 4px solid var(--green); border-radius: 28px; text-align: center; padding: 22px 10px 26px; }
  .fact .icon { font-size: 64px; }
  .fact .label { font-size: 30px; color: #4f5f57; margin-top: 4px; }
  .fact .value { font-size: 58px; font-weight: 700; color: var(--green-dark); line-height: 1.35; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; background: var(--green-dark); color: #e8f3ec; text-align: center; font-size: 30px; padding: 22px; }
</style>
</head>
<body>
  <div class="top"><span class="who">📢 សង្កាត់ទន្លេបាសាក់</span><span class="tag">សាកល្បង</span></div>
  <div class="hero">
    <div class="truck">🚛</div>
    <h1>រថយន្តប្រមូលសំរាម</h1>
  </div>
  <div class="facts">
    <div class="fact"><div class="icon">📅</div><div class="label">ចាប់ពី</div><div class="value">១ ធ្នូ</div></div>
    <div class="fact"><div class="icon">🏘️</div><div class="label">ភូមិ</div><div class="value">១ – ៨</div></div>
    <div class="fact"><div class="icon">🕕</div><div class="label">ម៉ោង</div><div class="value">៦:០០ ល្ងាច</div></div>
  </div>
  <div class="bottom">ទិន្នន័យសាកល្បងសម្រាប់ការបង្ហាញ</div>
</body>
</html>
