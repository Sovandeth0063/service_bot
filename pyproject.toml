[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sangkat-bot"
version = "0.1.0"
description = "SangkatConnect: Telegram commune information bot (demo MVP)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.33,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
media = ["edge-tts>=7", "imageio-ffmpeg>=0.5"]  # scripts/make_voice.py only

[tool.setuptools.packages.find]
include = ["sangkat_bot*"]

[tool.setuptools.package-data]
sangkat_bot = ["schema.sql", "khmer/resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
